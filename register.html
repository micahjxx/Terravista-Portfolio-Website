<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TERRAVISTA | Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">TERRAVISTA</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Destinations</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="register.html" class="nav-button active-button">
                Register
            </a>
        </div>

    </nav>


    <main>

        <section class="form-section">

            <div class="form-box">

                <p class="section-label">JOIN US</p>

                <h1>Create Your Account</h1>

                <p>
                    Register to become part of our travel community.
                </p>


                <form action="thankyou.html">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                    >


                    <label for="country">Favorite Destination</label>

                    <input
                        type="text"
                        id="country"
                        name="country"
                        placeholder="Example: Palawan"
                    >


                    <label for="message">Why do you like traveling?</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your answer..."
                    ></textarea>


                    <button type="submit" class="button primary full-button">
                        Submit Registration
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 TERRAVISTA Travel Portfolio</p>
    </footer>

</body>
</html>
